<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Didi Malatang</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="login-gate" class="login-gate">
      <div class="login-card">
        <img class="login-logo" src="logo.jpg" alt="Didi Malatang" />
        <h1>Didi Malatang</h1>
        <form id="login-form" class="stack">
          <label>
            ชื่อ
            <input name="name" placeholder="ชื่อของคุณ หรือพิมพ์ 'Owner'" required />
          </label>
          <label>
            รหัส PIN
            <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required />
          </label>
          <button class="btn" type="submit">เข้าสู่ระบบ</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
    </div>

    <div id="app-root" hidden>
      <header class="topbar">
        <div class="row" style="gap:0.6rem;">
          <img class="topbar-logo" src="logo.jpg" alt="Didi Malatang" />
          <h1>Didi Malatang</h1>
        </div>
        <nav class="topnav" aria-label="Main navigation">
          <button class="nav-btn active" data-action="nav-home" data-view="home">หน้าหลัก</button>
          <button class="nav-btn" data-action="nav-timesheet" data-view="timesheet">ลงเวลา</button>
          <button class="nav-btn" data-action="nav-warehouse" data-view="warehouse">คลังสินค้า</button>
          <button class="nav-btn" data-action="nav-routines" data-view="routines">เช็คลิสต์</button>
          <button class="nav-btn" data-action="nav-admin" data-view="admin" data-role-min="Admin">แอดมิน</button>
          <button class="nav-btn" data-action="nav-financial" data-view="financial" data-role-min="Admin">การเงิน</button>
          <button class="nav-btn" data-action="nav-notifications" data-view="notifications">แจ้งเตือน</button>
        </nav>
        <div class="user-chip">
          <span id="current-user-label"></span>
          <button class="btn secondary" data-action="logout">ออกจากระบบ</button>
        </div>
      </header>

      <main class="app-shell">
        <aside class="sidebar">
          <h2>ภาพรวมด่วน</h2>
          <div id="sidebar-summary" class="sidebar-card"></div>
        </aside>
        <section id="view" class="content"></section>
      </main>
    </div>

    <div id="modal-host"></div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
  </body>
</html>
